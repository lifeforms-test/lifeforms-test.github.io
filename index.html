      {
        text: "Обычно ты:",
        answers: [
          { t: "Ешь просто и регулярно", w: { tree: 2, hive: 1 } },
          { t: "Чувствуешь, что и когда хочется", w: { mycelium: 2, mammal: 1, microbe: 1 } },
          { t: "Следишь за режимом или пользой", w: { hive: 2, tree: 1 } },
          { t: "Можешь долго обходиться без еды", w: { reptile: 2, tree: 1, microbe: 2 } },
          { t: "Связываешь еду с эмоциями", w: { mammal: 2, mycelium: 1 } },
        ],
      },
      {
        text: "Твоё отношение к родителям ближе к:",
        answers: [
          { t: "Принятию", w: { tree: 2, mycelium: 1 } },
          { t: "Сложной внутренней связи", w: { mycelium: 2, mammal: 1, microbe: 1 } },
          { t: "Чувству долга", w: { hive: 2, tree: 1 } },
          { t: "Дистанции", w: { reptile: 2, mycelium: 1, microbe: 1 } },
          { t: "Сильным, противоречивым эмоциям", w: { mammal: 2, reptile: 1, microbe: 1 } },
        ],
      },
      {
        text: "Думая о детях (реальных или гипотетических), ты скорее думаешь о:",
        answers: [
          { t: "Стабильности", w: { tree: 2, hive: 1 } },
          { t: "Внутреннем мире", w: { mycelium: 2, tree: 1, microbe: 1 } },
          { t: "Воспитании и структуре", w: { hive: 2, mammal: 1 } },
          { t: "Выживании и защите", w: { reptile: 2, tree: 1, microbe: 2 } },
          { t: "Любви", w: { mammal: 2, mycelium: 1 } },
        ],
      },
      {
        text: "Жизнь для тебя — это:",
        answers: [
          { t: "Процесс роста", w: { tree: 2, mycelium: 1 } },
          { t: "Путь трансформации", w: { mycelium: 2, reptile: 1, microbe: 1 } },
          { t: "Последовательность действий", w: { hive: 2, tree: 1 } },
          { t: "Среда для выживания", w: { reptile: 2, hive: 1, microbe: 2 } },
          { t: "История чувств", w: { mammal: 2, mycelium: 1 } },
        ],
      },
      {
        text: "Если ничего не нужно доказывать, ты бы:",
        answers: [
          { t: "Просто был", w: { tree: 2, reptile: 1 } },
          { t: "Чувствовал и наблюдал", w: { mycelium: 2, tree: 1, microbe: 1 } },
          { t: "Делал что-то полезное", w: { hive: 2, mammal: 1 } },
          { t: "Отдыхал", w: { reptile: 2, tree: 1, microbe: 1 } },
          { t: "Был с кем-то", w: { mammal: 2, tree: 1 } },
        ],
      },
      {
        text: "Твоя главная сила — в:",
        answers: [
          { t: "Устойчивости", w: { tree: 2, hive: 1 } },
          { t: "Глубине", w: { mycelium: 2, mammal: 1, microbe: 1 } },
          { t: "Функциональности", w: { hive: 2, reptile: 1 } },
          { t: "Адаптивности", w: { reptile: 2, hive: 1, microbe: 2 } },
          { t: "Эмоциональности", w: { mammal: 2, mycelium: 1 } },
        ],
      },
      {
        text: "А твоя главная уязвимость — в:",
        answers: [
          { t: "Пассивности", w: { tree: 2, mycelium: 1 } },
          { t: "Растворённости", w: { mycelium: 2, mammal: 1, microbe: 1 } },
          { t: "Перегрузе", w: { hive: 2, mammal: 1, microbe: 1 } },
          { t: "Отстранённости", w: { reptile: 2, tree: 1, microbe: 1 } },
          { t: "Ранимости", w: { mammal: 2, mycelium: 1 } },
        ],
      },
    ];

    // ---------- ЛОГИКА ТЕСТА ----------
    const app = document.getElementById("app");

    const state = {
      seed: null,
      order: [],
      idx: 0,
      // история выбранных ответов: {qIndex, answerObj}
      picks: [],
      scores: { mammal: 0, reptile: 0, tree: 0, mycelium: 0, hive: 0, microbe: 0 },
    };

    function shuffle(arr) {
      // Fisher-Yates
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function reset() {
      state.idx = 0;
      state.picks = [];
      state.scores = { mammal: 0, reptile: 0, tree: 0, mycelium: 0, hive: 0, microbe: 0 };
      state.order = shuffle([...Array(QUESTIONS.length).keys()]);
      render();
    }

    function progressPct() {
      return Math.round((state.idx / QUESTIONS.length) * 100);
    }

    function addWeights(w) {
      for (const k of Object.keys(w)) {
        state.scores[k] = (state.scores[k] || 0) + w[k];
      }
    }
    function removeWeights(w) {
      for (const k of Object.keys(w)) {
        state.scores[k] = (state.scores[k] || 0) - w[k];
      }
    }

    function pickAnswer(answerObj) {
      const qIndex = state.order[state.idx];
      state.picks[state.idx] = { qIndex, answerObj };
      addWeights(answerObj.w);
      state.idx += 1;
      render();
    }

    function goBack() {
      if (state.idx <= 0) return;
      const prev = state.picks[state.idx - 1];
      if (prev?.answerObj?.w) removeWeights(prev.answerObj.w);
      state.picks.pop();
      state.idx -= 1;
      render();
    }

    function computeResult() {
      const entries = Object.entries(state.scores);
      const max = Math.max(...entries.map(([, v]) => v));
      const top = entries.filter(([, v]) => v === max).map(([k]) => k);
      const winner = top[Math.floor(Math.random() * top.length)]; // тай-брейк
      return { winner, scores: state.scores };
    }

    function renderStart() {
  app.innerHTML = `
    <div class="startPanel">
      <div class="brandSub">интерфейс самоощущения</div>
      <h1 class="brand">Форма жизни</h1>

      <p class="lead">
        Небольшой тест, чтобы посмотреть, какая форма жизни сейчас ближе: темп, реакция на сложность,
        отношения, потребности. Без диагнозов — просто отражение.
      </p>

      <p class="note">
        Вопросы и варианты ответов перемешиваются. Выбирай интуитивно — долго не думай.
      </p>

      <div class="spacer"></div>
      <div class="row">
        <button class="btn start" id="startBtn">Начать</button>
        <span class="pill">Вопросов: ${QUESTIONS.length}</span>
      </div>
    </div>
  `;
  document.getElementById("startBtn").onclick = reset;
}


    function renderQuestion() {
      const qIndex = state.order[state.idx];
      const q = QUESTIONS[qIndex];

      const answers = shuffle(q.answers); // рандом ответа на каждый показ вопроса
      const pct = progressPct();

      app.innerHTML = `
        <div class="row" style="justify-content:space-between;">
          <div class="pill">Вопрос ${state.idx + 1} из ${QUESTIONS.length}</div>
          <div class="pill">${pct}%</div>
        </div>
        <div class="spacer"></div>
        <div class="progress"><div class="bar" style="width:${pct}%;"></div></div>
        <div class="qtitle">${q.text}</div>
        <div class="answers" id="answers"></div>
        <div class="spacer"></div>
        <div class="row">
        <button class="btn primary" id="backBtn" ${state.idx === 0 ? "disabled" : ""}>Назад</button>
          <span class="muted mini">Выбирай интуитивно, не раздумывая.</span>
        </div>
      `;

      const answersEl = document.getElementById("answers");
      answers.forEach((a) => {
        const btn = document.createElement("button");
        btn.className = "choice";
        btn.type = "button";
        btn.textContent = a.t;
        btn.onclick = () => pickAnswer(a);
        answersEl.appendChild(btn);
      });

      document.getElementById("backBtn").onclick = goBack;
    }

    function renderResult() {
      const { winner, scores } = computeResult();
      const max = Math.max(...Object.values(scores));
      const norm = max === 0 ? 1 : max;

      const order = Object.keys(TYPES);

      app.innerHTML = `
        <h1>Твой результат</h1>
        <div class="resultTitle">${TYPES[winner]}</div>
        <div class="muted">${TYPE_DESC[winner]}</div>

        <div class="spacer"></div>
<div class="card" style="padding:14px; border-radius:0;">
  <div class="row" style="gap:8px;">
    ${TYPE_STATS[winner].map(s => `<span class="stat">${s}</span>`).join("")}
  </div>
  <div class="spacer" style="height:10px;"></div>
  <div class="mini">${TYPE_HELP[winner]}</div>
</div>

        <div class="grid2">
          ${order.map((k) => {
            const v = scores[k];
            const pct = Math.round((v / norm) * 100);
            return `
              <div class="card" style="padding:14px; border-radius:14px;">
                <div class="scoreRow">
                  <div>${TYPES[k]}</div>
                  <div class="muted">${v}</div>
                </div>
                <div class="spacer" style="height:8px;"></div>
                <div class="scoreBarWrap"><div class="scoreBar" style="width:${pct}%;"></div></div>
              </div>
            `;
          }).join("")}
        </div>

        <div class="spacer"></div>
        <div class="row">
          <button class="btn primary" id="againBtn">Пройти ещё раз</button>
          <button class="btn primary" id="homeBtn">На старт</button>
        </div>
      `;

      document.getElementById("againBtn").onclick = reset;
      document.getElementById("homeBtn").onclick = () => {
        state.idx = 0;
        state.picks = [];
        state.scores = { mammal: 0, reptile: 0, tree: 0, mycelium: 0, hive: 0, microbe: 0 };
        state.order = [];
        render();
      };
    }

    function render() {
      if (!state.order.length && state.idx === 0 && state.picks.length === 0) {
        renderStart();
        return;
      }
      if (state.idx < QUESTIONS.length) {
        renderQuestion();
        return;
      }
      renderResult();
    }

    renderStart();
  </script>
</body>
